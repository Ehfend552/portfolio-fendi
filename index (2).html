<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kopi Senja - Ngopi Dulu Ga Si</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Arial", sans-serif;
      }
      body {
        background: #1a0e0a;
        color: #fff;
      }
      .hero {
        min-height: 100vh;
        display: flex;
        align-items: center;
        padding: 0 8%;
        background:
          linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
          url("https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?w=1200")
            center/cover;
      }
      .content {
        max-width: 600px;
      }
      h1 {
        font-size: 64px;
        font-weight: 900;
        line-height: 1.1;
        margin-bottom: 20px;
      }
      h1 span {
        color: #ff8c00;
      }
      p {
        color: #ccc;
        font-size: 18px;
        margin-bottom: 32px;
        line-height: 1.6;
      }
      .btn {
        background: #ff8c00;
        color: #1a0e0a;
        padding: 16px 32px;
        border-radius: 50px;
        text-decoration: none;
        font-weight: bold;
        display: inline-block;
        transition: 0.3s;
      }
      .btn:hover {
        transform: scale(1.05);
        box-shadow: 0 0 30px #ff8c00;
      }
      .menu {
        padding: 80px 8%;
        text-align: center;
      }
      .menu h2 {
        font-size: 40px;
        margin-bottom: 50px;
      }
      .grid {
        display: flex;
        gap: 30px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .card {
        background: #2a1a14;
        padding: 24px;
        border-radius: 16px;
        width: 250px;
      }
      .card h3 {
        margin-bottom: 8px;
        color: #ff8c00;
      }
      @media (max-width: 768px) {
        h1 {
          font-size: 40px;
        }
        .hero {
          padding: 0 5%;
        }
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <div class="content">
        <h1>KOPI SENJA<br /><span>#NgopiDuluGaSi</span></h1>
        <p>
          Kopi susu gula aren terenak se-Jakarta Barat. Biji kopi pilihan,
          digiling dadakan. Bikin harimu makin senja.
        </p>
        <a
          href="https://wa.me/6285718509645?text=Mau%20pesan%20Kopi%20Senja%20bang"
          class="btn"
          target="_blank"
          >Pesan Sekarang</a
        >
      </div>
    </section>

    <section class="menu">
      <h2>Menu Andalan</h2>
      <div class="grid">
        <div class="card">
          <h3>Kopi Susu Senja</h3>
          <p>18K</p>
        </div>
        <div class="card">
          <h3>Americano Dingin</h3>
          <p>15K</p>
        </div>
        <div class="card">
          <h3>Matcha Latte</h3>
          <p>22K</p>
        </div>
      </div>
    </section>
  </body>
</html>
